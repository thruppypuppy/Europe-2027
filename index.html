<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Europe 2027 Trip Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with tabs over one working column. Calendar = weeks of day boxes (location band, stay, travel, notes); Itinerary = three editable tables that feed everything else. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --ink:#14243D; --muted:#5A6A82; --line:#DAE1EA;
  --blue:#4F7AA6; --blue-soft:#E4ECF5; --accent:#B5452C; --accent-soft:#F7E4DD; --sand:#EEE6D6;
  --good:#276B45; --good-bg:#DDF0E3; --warn:#7A5A0C; --warn-bg:#FAEFCB; --bad:#B5452C; --bad-bg:#F7E4DD;
  --slate:#5B6B80; --off:#ECEFF3;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --surface:#162238; --ink:#E6ECF5; --muted:#97A8C0; --line:#263650;
  --blue:#8CB0D8; --blue-soft:#1E3250; --accent:#EE9378; --accent-soft:#3A2420; --sand:#2A3040;
  --good:#7FD1A0; --good-bg:#16382A; --warn:#E9C46A; --warn-bg:#3B3216; --bad:#EE9378; --bad-bg:#3A2420;
  --slate:#4A5A70; --off:#1B283D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1726; --surface:#162238; --ink:#E6ECF5; --muted:#97A8C0; --line:#263650;
  --blue:#8CB0D8; --blue-soft:#1E3250; --accent:#EE9378; --accent-soft:#3A2420; --sand:#2A3040;
  --good:#7FD1A0; --good-bg:#16382A; --warn:#E9C46A; --warn-bg:#3B3216; --bad:#EE9378; --bad-bg:#3A2420;
  --slate:#4A5A70; --off:#1B283D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.topline h1{font-size:22px;line-height:1.1}
.topline p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.sync.bad{background:var(--bad-bg);color:var(--bad)}
.sync.warn{background:var(--warn-bg);color:var(--warn)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.viewas{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.viewas select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border:1px solid currentColor;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-top:20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.cardhead h2{font-size:17px}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}
.cardhead p,.hint{margin:2px 0 0;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-family:var(--display);font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.verdict{margin:6px 16px 10px;padding:12px 14px;border-radius:8px;background:var(--sand);font-family:var(--display);font-size:20px;font-weight:700}
.verdict.sq{background:var(--good-bg);color:var(--good)}
.verdict.owe{color:var(--accent)}
.tbl-wrap{overflow-x:auto;padding:8px 10px 12px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;white-space:nowrap}
td{padding:2px 2px;vertical-align:middle;border-top:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c{padding:4px 8px;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);padding:8px 8px}
table.plain td{padding:8px 8px}
table.plain th{padding:6px 8px}
.muted{color:var(--muted)} .zero{color:var(--muted)}
.in{width:100%;min-width:0;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px}
.in:hover{border-color:var(--line)}
.in:focus{outline:2px solid var(--blue);outline-offset:0;background:var(--surface);border-color:transparent}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
select.in{appearance:auto;padding:6px 4px}
.sel.st-Booked{background:var(--good-bg);color:var(--good);font-weight:600}
.sel.st-Paid{background:var(--good);color:var(--surface);font-weight:700}
.sel.st-Researching{background:var(--warn-bg);color:var(--warn);font-weight:600}
.sel.st-Considering{background:var(--blue-soft);color:var(--blue);font-weight:600}
.sel.st-Cancelled{color:var(--muted);text-decoration:line-through}
.sel.needs{background:var(--bad-bg);color:var(--bad);font-weight:600}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--blue-soft);color:var(--blue);white-space:nowrap}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn:focus-visible,nav.tabs a:focus-visible,.del:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.del{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:6px;white-space:nowrap}
.del:hover,.del.armed{color:var(--bad);background:var(--bad-bg)}
button:disabled,.in:disabled{cursor:not-allowed;opacity:.6}
.issues{margin:0;padding:6px 16px 14px;list-style:none;display:flex;flex-direction:column;gap:6px}
.issues li{padding:8px 10px;border-radius:7px;background:var(--bad-bg);color:var(--bad);font-weight:500}
.issues li a{color:inherit;font-weight:700}
.issues li.ok{background:var(--good-bg);color:var(--good)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:10px 16px 16px}
.formgrid label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--muted);font-size:12px;min-width:0}
.formgrid .in{border-color:var(--line);background:var(--bg);color:var(--ink)}
.empty{padding:22px 16px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500}
.loading{padding:48px 16px;text-align:center;color:var(--muted)}
.catbar{display:block;height:5px;border-radius:3px;background:var(--blue);margin-top:4px;min-width:2px}
.how{padding:2px 16px 12px;color:var(--muted);font-size:13px;margin:0}

/* calendar */
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px 12px}
.lg{padding:3px 11px;border-radius:6px;font-weight:700;font-size:12px;color:#fff;background:var(--slate)}
.lg.ok{background:var(--good-bg);color:var(--good)} .lg.todo{background:var(--warn-bg);color:var(--warn)}
.lg.bad{background:var(--accent);color:#fff} .lg.cx{background:var(--off);color:var(--muted);text-decoration:line-through}
.weekhead,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.weekhead{padding:0 12px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.weeks{display:flex;flex-direction:column;gap:10px;padding:0 12px 14px}
.cday{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.cday.out{background:var(--off);border-style:dashed;min-height:60px}
.cday.out .ch{background:transparent;color:var(--muted);font-weight:600}
.ch{padding:5px 9px;color:#fff;font-size:12px;font-weight:700;background:var(--slate)}
.cl{padding:3px 9px 6px;color:#fff;font-family:var(--display);font-size:16px;font-weight:700;background:var(--slate);line-height:1.2}
.cs,.ct{padding:6px 9px;font-size:12px;min-height:50px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.ct{min-height:62px}
.cs b,.ct b{font-weight:700}
.cs span,.ct span{font-weight:700}
.ok{background:var(--good-bg);color:var(--good)} .todo{background:var(--warn-bg);color:var(--warn)}
.cx{background:var(--off);color:var(--muted)} .cx b{text-decoration:line-through}
.cnote{border-top:1px solid var(--line);margin-top:auto}
.cnote textarea{display:block;width:100%;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:7px 9px;min-height:66px;resize:vertical}
.cnote textarea:focus{outline:2px solid var(--blue);outline-offset:-2px;background:var(--surface)}
.calbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:4px 16px 10px}
.calbar .lbl{font-weight:700;font-size:13px;color:var(--muted)}
.chipck{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.chipck input{width:16px;height:16px;accent-color:var(--blue)}
.btn.sm{padding:3px 9px;font-size:12px}
.planbtns{display:flex;gap:8px;flex-wrap:wrap}
.planlist{display:flex;flex-direction:column;gap:6px;padding:6px 16px 8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prow.moved{border-color:var(--blue);background:var(--blue-soft)}
.pdot{width:12px;height:12px;border-radius:50%;flex:none}
.pd{color:var(--muted);font-size:13px;flex:1;min-width:160px}.pd i{font-style:normal;color:var(--blue)}
.pbtn{display:flex;gap:6px}
.pj{padding:4px 16px 14px;font-weight:500}
.cday.dragme{cursor:grab}.cday.dragging{opacity:.45}.cday.dropt{outline:3px solid var(--blue);outline-offset:-3px}
.co{padding:6px 9px;font-size:12px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere;border-top:1px solid var(--line)}
.co.ok{background:var(--good-bg);color:var(--good)}.co.todo{background:var(--warn-bg);color:var(--warn)}
.okmsg{background:var(--good-bg);color:var(--good)}
@media (max-width:900px){
  .weekhead{display:none}
  .week{grid-template-columns:minmax(0,1fr)}
  .cday.out{display:none}
  .cs,.ct{min-height:0}
  .cs:empty,.ct:empty{display:none}
  .topline h1{font-size:19px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.payform{margin:8px 16px 12px;padding:12px 14px;border:1px solid var(--blue);background:var(--blue-soft);border-radius:8px}.payform h3{margin:0 0 8px;font-size:15px}.payform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.cday{min-width:0}
.cday.blank{border:0;background:transparent}
.cday.offtrip .ch{background:var(--slate)!important;opacity:.75}
.ch{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 8px}
.bd{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:var(--good-bg);color:var(--good)}
.bd.lvl{background:var(--warn-bg);color:var(--warn)}
.lg.fr{background:var(--good-bg);color:var(--good)}.lg.lvl{background:var(--warn-bg);color:var(--warn)}
.half{display:flex;flex-direction:column;min-height:34px;position:relative}
.half>small{position:absolute;top:2px;left:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.8;color:#fff;z-index:1;text-shadow:0 0 2px rgba(0,0,0,.35)}
.half.nil{background:var(--off)}.half.nil>small{color:var(--muted);text-shadow:none}
.half.none{background:var(--accent);color:#fff;justify-content:center;padding:12px 8px 3px}.half.none>b{font-size:12px}
.half+.half{border-top:1px dashed rgba(255,255,255,.6)}
.blks{display:flex;flex-direction:column;flex:1}
.blk{flex:1;color:#fff;padding:13px 8px 3px;display:flex;flex-direction:column;justify-content:center;min-height:34px;overflow-wrap:anywhere}
.blk+.blk{border-top:1px solid rgba(255,255,255,.55)}
.blk b{font-family:var(--display);font-size:14px;line-height:1.15}
.blk span{font-size:10.5px;font-weight:600;opacity:.95;line-height:1.2}
.half:not(:has(small)) .blk{padding-top:6px}
.half.full{flex:1}.half.full .blk{justify-content:flex-start;padding-top:8px}
.blk[draggable=true]{cursor:grab}.blk.dragging{opacity:.4}
.cx2{display:flex;flex-direction:column}
.ct2{font-size:11px;padding:4px 8px;line-height:1.25;overflow-wrap:anywhere;border-top:1px solid var(--line)}
.cnote textarea{min-height:30px!important;font-size:12px!important;padding:5px 8px!important}
.leavebar{margin:4px 16px 10px;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);display:flex;flex-direction:column;gap:2px;font-size:13px}
.leavebar b{font-size:15px}
.frows{display:flex;flex-direction:column;gap:6px;padding:0 16px 14px}.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pdl{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);gap:2px}.pdl .in{width:140px}
.pn{min-width:90px}
@media (max-width:700px){.cday.blank{display:none}}
.itin{width:100%;margin:0;display:flex;flex-direction:column;padding:0 0 8px}
.pbox{border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:14px 18px;color:#fff}
.phead h3{margin:0;font-family:var(--display);font-size:24px;line-height:1.1}.phead small{font-size:13px;font-weight:600;opacity:.92}
.ptot{background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px;font-weight:700;font-size:13px}
.sect{padding:6px 14px 8px}.sect+.sect{border-top:1px dashed var(--line)}
.sect>.lbl,.leg>.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800;padding:6px 2px 2px}
.item{border:1px solid var(--line);border-radius:14px;background:var(--bg);margin:6px 0;overflow:hidden}
.item.open{border-color:var(--blue);background:var(--surface)}
.irow{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;outline:none}
.irow:hover,.irow:focus-visible{background:var(--blue-soft)}
.ic{font-size:18px;flex:none;width:26px;text-align:center}
.it{flex:1;min-width:0;display:flex;flex-direction:column}.it b{font-size:14px;overflow-wrap:anywhere}.it small{color:var(--muted);font-size:12px}
.chipst{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.cost{font-weight:700;font-size:13px;white-space:nowrap}.chev{color:var(--muted);flex:none}
.iedit{border-top:1px solid var(--line);padding:2px 0 12px}
.iedit .formgrid{padding:10px 14px 4px}.iedit label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}.iedit label.wide{grid-column:1/-1}
.iact{display:flex;justify-content:space-between;align-items:center;padding:6px 14px 0}
.leg{width:calc(100% - 72px);margin:0 auto;padding:8px 16px 10px;background:var(--blue-soft);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
.leg::before{content:"";position:absolute;left:-1px;top:0;bottom:0;border-left:3px dashed var(--blue)}
.leg .item{background:var(--surface)}
.addb{margin:4px 0 2px;border-style:dashed}
.itinfoot{margin:14px 0 24px;text-align:center}
.legnote{margin:10px 14px 0;padding:8px 12px;border-radius:10px;background:var(--blue-soft);font-size:12.5px;line-height:1.45}.legnote .btn{margin-left:6px}.item.auto{border-style:dashed}
.leg.slim{height:16px;padding:0}.leg.slim .lbl{display:none}.homerow{padding:4px 2px 6px}.homerow label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);max-width:280px}
.phead.tap{cursor:pointer;outline:none}.phead.tap:hover,.phead.tap:focus-visible{filter:brightness(1.07)}.ptail{display:flex;align-items:center;gap:8px;flex:none}.pedit{font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:99px}.pbox>.iedit{background:var(--surface)}
.half.fly{background:var(--slate);color:#fff;justify-content:center;padding:12px 8px 3px}.half.fly>b{font-size:12px}
.cday{display:flex;flex-direction:column}
.cmid{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:thin}
.cmid>.half{flex:1 1 auto}.cmid>.half.full{flex:1 1 auto}
.cx2{flex:none}.cnote{flex:none}
@media (min-width:701px){
.ct2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half{min-height:30px}.blk{min-height:30px}
.cday{aspect-ratio:1/1;overflow:hidden}
.cnote textarea{height:30px!important;min-height:30px!important;resize:none!important}
.ct2{font-size:10.5px;padding:3px 8px}
}

/* standalone page basics */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#who{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
</style></head>
<body>
<header class="top"><div class="wrap">
  <div class="topline"><div><h1>Europe 2027</h1><p id="sub"></p></div><div class="topright" id="topright" hidden><span id="who"></span><label class="viewas">Viewing <select id="viewas" aria-label="Whose bookings to show"></select></label><span class="sync" id="sync">Loading…</span><button class="btn" data-act="signout" type="button">Sign out</button></div></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view"><div class="loading">Loading your trip…</div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var COLLS=['stays','travel','other','days','payments'],NEED=COLLS.length+1;
var STATUS=['Researching','Considering','Booked','Paid','Cancelled'];
var TYPES=['Flight','Train','Car hire','Bus','Ferry','Taxi','Other'];

var PAL=['#2F5D8A','#C8553D','#2E8B7A','#8A6BB0','#D08C2B','#4E8F4A','#B2456E','#5B6C7D','#7C5E3C','#3F8FB5'];
var DEF={p1:'Thrupps',p2:'Ameer-Begs',start:'2027-08-13',end:'2027-09-11',settleP1:0,settleP2:0,leaveBefore:0,leaveSep:0,home:'Sydney',free:[{date:'2027-08-19',part:'pm'},{date:'2027-08-20',part:'full'}]};

function cfg(){var s=S.settings||{};var o={};for(var k in DEF)o[k]=DEF[k];for(k in s)if(s[k]!=null)o[k]=s[k];return o}
var money=function(n,dp){dp=dp||0;return new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',minimumFractionDigits:dp,maximumFractionDigits:dp}).format(n||0)};
var mny=function(n){return Math.abs(n)<0.005?'<span class="zero">–</span>':money(n,2)};
var dfmt=function(iso,o){return iso?new Date(iso+'T00:00:00Z').toLocaleDateString('en-AU',Object.assign({timeZone:'UTC'},o||{day:'numeric',month:'short'})):''};
var isoOf=function(d){return d.toISOString().slice(0,10)};
var addDays=function(iso,n){return isoOf(new Date(new Date(iso+'T00:00:00Z').getTime()+n*864e5))};
var wdMon=function(iso){return (new Date(iso+'T00:00:00Z').getUTCDay()+6)%7};
var arr=function(o){return Object.keys(o||{}).map(function(id){return Object.assign({id:id},o[id])})};
var byDate=function(k){return function(a,b){return (a[k]||'9999').localeCompare(b[k]||'9999')||((a.created||0)-(b.created||0))}};
var norm=function(s){return String(s||'').trim().toLowerCase()};
var PARTY=function(k){var c=cfg();return k==='1'?c.p1:c.p2};
var forOf=function(it){var f=String(it.for==null?'shared':it.for);return (f==='1'||f==='2')?f:'shared'};
var vis=function(it){return VIEW==='all'||forOf(it)==='shared'||forOf(it)===VIEW};
var tagOf=function(it){var f=forOf(it);return f==='shared'?'':'<span class="tag">'+esc(PARTY(f))+' only</span>'};
var nightsOf=function(a,b){return (a&&b)?Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5):''};

/* ---------- saving ---------- */
function setSync(){
  var el=$('#sync');if(!el)return;var t='Saved',c='sync';
  if(AUTH!=='in'){t='Signed out';c+=' warn'}
  else if(noDb){t='Not saving';c+=' warn'}
  else if(Object.keys(loadedSet).length<NEED&&!timedOut){t='Loading…'}
  else if(Object.keys(loadedSet).length<NEED){t='Can’t reach saved data';c+=' warn'}
  else if(RO){t='View only';c+=' warn'}
  else if(writeFail){t='Not saved – check access';c+=' bad'}
  else if(inflight>0||pendingEdits>0){t='Saving…'}
  el.className=c;el.textContent=t;
}
function enqueue(k,fn){
  inflight++;setSync();
  var p=(chains[k]||Promise.resolve()).then(fn).then(function(){writeFail=false},function(e){writeFail=true;console.error(e)}).then(function(){
    inflight--;setSync();if(!pendingEdits&&needRender){render()}
  });
  chains[k]=p;return p;
}
function localDoc(c,i){return c==='meta'?cfg():S[c][i]}
function save(c,i,patch){
  if(!db)return;var k=c+'/'+i;var e=q[k];if(!e){e=q[k]={patch:{},timer:null}}
  if(!e.timer)pendingEdits++;
  Object.assign(e.patch,patch);clearTimeout(e.timer);
  e.timer=setTimeout(function(){
    var pt=e.patch;e.patch={};e.timer=null;pendingEdits--;
    enqueue(k,function(){
      var ref=db.doc(k);
      if(confirmed[k])return ref.update(pt);
      return ref.set(localDoc(c,i)).then(function(){confirmed[k]=1});
    });
  },500);
  setSync();
}
function applyLocal(c,i,patch){
  if(c==='meta'){S.settings=Object.assign({},S.settings||{},patch);return}
  if(!S[c][i])S[c][i]=(c==='days')?{date:i}:{};
  Object.assign(S[c][i],patch);
}
function add(c,data){
  if(!db)return;var ref=db.collection(c).doc();var id=ref.id;
  var doc=Object.assign({},data,{created:Date.now()});S[c][id]=doc;var k=c+'/'+id;
  enqueue(k,function(){return ref.set(doc).then(function(){confirmed[k]=1})});
  render();return id;
}
function remove(c,i){
  var k=c+'/'+i;delete S[c][i];
  enqueue(k,function(){return db.doc(k).delete().then(function(){delete confirmed[k]})});
  render();
}

/* ---------- calculations ---------- */
function allItems(){
  var out=[];
  arr(S.stays).forEach(function(x){x.kind='stays';x.label=x.location;x.bucket='Accommodation';out.push(x)});
  arr(S.travel).forEach(function(x){x.kind='travel';x.label=x.from||x.to;x.bucket=({'Flight':'Flights','Train':'Trains','Car hire':'Car hire'})[x.type]||'Other transport';out.push(x)});
  arr(S.other).forEach(function(x){x.kind='other';x.label=x.item;x.bucket='Other bookings';out.push(x)});
  return out;
}
var shareOf=function(it){if(it.share!=null&&it.share!=='')return +it.share||0;var f=forOf(it),cost=+it.cost||0;return f==='1'?cost:(f==='2'?0:cost*0.5)};
function calc(){
  var its=allItems(),T={cost:0,paid:0,yet:0,paid1:0,paid2:0,fair1:0,yet1:0,missing:0,n:0,done:0,types:{}};
  ['Accommodation','Flights','Trains','Car hire','Other transport','Other bookings'].forEach(function(k){T.types[k]={cost:0,paid:0}});
  its.forEach(function(it){
    var canc=it.status==='Cancelled',cost=+it.cost||0,isPaid=it.status==='Paid';
    if(it.status==='Booked'||isPaid)T.done++;
    if(canc)return;
    if(it.label)T.n++;
    T.cost+=cost;T.types[it.bucket].cost+=cost;
    if(isPaid){
      T.paid+=cost;T.types[it.bucket].paid+=cost;
      if(String(it.paidBy)==='1'){T.paid1+=cost;T.fair1+=shareOf(it)}
      else if(String(it.paidBy)==='2'){T.paid2+=cost;T.fair1+=shareOf(it)}
      else T.missing++;
    }else T.yet1+=shareOf(it);
  });
  T.yet=T.cost-T.paid;T.fair2=T.paid1+T.paid2-T.fair1;T.yet2=T.yet-T.yet1;
  var c=cfg();T.s1=+c.settleP1||0;T.s2=+c.settleP2||0;arr(S.payments).forEach(function(p){var a=+p.amount||0;if(p.from==='1')T.s1+=a;else if(p.from==='2')T.s2+=a});T.balance=(T.paid1-T.fair1)+T.s1-T.s2;
  return T;
}
var STAYS_OVR=null;
function stayOn(d){var m=null;(STAYS_OVR||arr(S.stays)).filter(vis).sort(byDate('checkIn')).forEach(function(s){if(s.checkIn&&s.checkOut&&s.checkIn<=d&&s.checkOut>d)m=s});return m}
function flightOn(d,night){var m=null;arr(S.travel).forEach(function(t){if(!t.date||!(t.type==='Flight'||t.leg))return;var e=t.arriveDate||t.date;if(t.date<=d&&(night?d<e:d<=e))m=t});return m}
function issues(){
  var c=cfg(),out=[];
  if(!c.start||!c.end||c.end<c.start)return out;
  for(var d=c.start;d<c.end;d=addDays(d,1)){if(!stayOn(d)&&!flightOn(d,true))out.push('No stay recorded for the night of '+dfmt(d)+'.')}
  arr(S.travel).filter(vis).sort(byDate('date')).forEach(function(t){
    if(!t.date)return;var lab=(t.type||'Journey').toLowerCase()+' '+(t.from||'?')+' → '+(t.to||'?')+' on '+dfmt(t.date);
    var prev=addDays(t.date,-1);
    if(prev>=c.start&&prev<=c.end){var st=stayOn(prev);if(st&&t.from&&norm(st.location)!==norm(t.from))out.push('The '+lab+' leaves from '+t.from+', but the night before you are in '+st.location+'.')}
    var st2=stayOn(t.date);if(st2&&t.to&&norm(st2.location)!==norm(t.to))out.push('The '+lab+' arrives in '+t.to+', but your stay that night is in '+st2.location+'.');
  });
  return out;
}

function vSummary(){
  var m=calc(),c=cfg(),pct=m.cost>0?Math.min(100,m.paid/m.cost*100):0,sq=Math.abs(m.balance)<0.5;
  var verdict=sq?'All square. Nobody owes anything right now.':(m.balance>0?esc(c.p2)+' owe '+esc(c.p1)+' '+money(m.balance,2):esc(c.p1)+' owe '+esc(c.p2)+' '+money(-m.balance,2));

    '<tr><td>Share of what is still to pay</td><td class="n">'+mny(m.yet1)+'</td><td class="n">'+mny(m.yet2)+'</td></tr></tbody></table></div></section>'+payCard(m,c)+
  '<section class="card"><div class="cardhead"><div><h2>By type</h2></div></div><div class="tbl-wrap"><table class="plain"><thead><tr><th>Type</th><th class="n">Cost</th><th class="n">Paid</th><th class="n">Yet to pay</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td>Total</td><td class="n">'+money(m.cost,2)+'</td><td class="n">'+money(m.paid,2)+'</td><td class="n">'+money(m.yet,2)+'</td></tr></tfoot></table></div></section>';

var PAY={open:false,from:'1',amount:'',date:'',what:'',err:''};
var todayIso=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function payCard(m,c){
  var list=arr(S.payments).sort(byDate('date'));

  var form=PAY.open?'<div class="payform"><h3>Record a payment</h3><div class="formgrid">'+
    '<label>Who paid whom<select class="in sel" id="pay-from" data-payf="from"><option value="1"'+(PAY.from==='1'?' selected':'')+'>'+esc(c.p1)+' paid '+esc(c.p2)+'</option><option value="2"'+(PAY.from==='2'?' selected':'')+'>'+esc(c.p2)+' paid '+esc(c.p1)+'</option></select></label>'+
    '<label>How much (AUD)<input class="in num" id="pay-amount" data-payf="amount" inputmode="decimal" value="'+esc(PAY.amount)+'" autocomplete="off" placeholder="0.00"></label>'+

    (PAY.err?'<div class="notice bad" style="margin:8px 0">'+esc(PAY.err)+'</div>':'')+
    '<div class="planbtns" style="margin-top:10px"><button class="btn primary" data-pay="save">Save payment</button><button class="btn" data-pay="cancel">Cancel</button></div></div>':'';
  return '<section class="card"><div class="cardhead"><div><h2>Settle-up payments</h2><p>Money one of you has paid to the other to square up. These are counted in Who owes who.</p></div>'+(PAY.open?'':'<button class="btn primary" data-pay="open"'+(RO?' disabled':'')+'>+ Record a payment</button>')+'</div>'+legacy+form+
    '<div class="tbl-wrap"><table class="plain" style="min-width:640px"><thead><tr><th>Date</th><th>Who paid whom</th><th class="n">Amount</th><th>For</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="empty">No settle-up payments yet.</td></tr>')+'</tbody>'+(list.length?'<tfoot><tr><td></td><td>Total paid</td><td class="n">'+esc(c.p1)+' '+money(m.s1,2)+'<br>'+esc(c.p2)+' '+money(m.s2,2)+'</td><td></td><td></td></tr></tfoot>':'')+'</table></div></section>';
}
function payEvt(e){var t=e.target;if(t&&t.dataset&&t.dataset.payf){PAY[t.dataset.payf]=t.value;if(PAY.err&&t.dataset.payf==='amount'){PAY.err='';var n=document.querySelector('.payform .notice');if(n)n.remove()}}}
document.addEventListener('input',payEvt,true);document.addEventListener('change',payEvt,true);
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button[data-pay]');if(!b||RO)return;var a=b.dataset.pay;
  if(a==='open'){PAY={open:true,from:'1',amount:'',date:todayIso(),what:'',err:''};render();var f=document.getElementById('pay-amount');if(f)f.focus()}
  else if(a==='cancel'){PAY.open=false;PAY.err='';render()}
  else if(a==='save'){
    var amt=parseFloat(String(PAY.amount).replace(/[$,\s]/g,''));
    if(!(amt>0)){PAY.err='Enter how much was paid.';render();return}
    add('payments',{date:PAY.date||todayIso(),from:PAY.from,amount:Math.round(amt*100)/100,what:String(PAY.what||'').trim()});
    PAY={open:false,from:'1',amount:'',date:'',what:'',err:''};render();
  }
});
var LAY={places:1,stays:0,travel:1,other:1,notes:1,leave:1};
try{var _l=JSON.parse(localStorage.getItem('tripLayers')||'null');if(_l)Object.keys(LAY).forEach(function(k){if(k in _l)LAY[k]=_l[k]?1:0})}catch(e){}
var PLAN={on:false,ids:[],d:{},base:{},moveJ:true,msg:'',msgAt:0};
function planStart(){
  var list=arr(S.stays).filter(vis).filter(function(s){return s.checkIn&&s.checkOut&&s.checkOut>s.checkIn}).sort(byDate('checkIn'));
  PLAN.ids=list.map(function(s){return s.id});PLAN.d={};PLAN.base={};
  list.forEach(function(s){PLAN.d[s.id]={checkIn:s.checkIn,checkOut:s.checkOut};PLAN.base[s.id]={checkIn:s.checkIn,checkOut:s.checkOut,location:s.location}});
  PLAN.on=true;PLAN.msg='';
}
function planChanged(){return PLAN.ids.some(function(id){return PLAN.d[id].checkIn!==PLAN.base[id].checkIn||PLAN.d[id].checkOut!==PLAN.base[id].checkOut})}
function planShift(id,n){var x=PLAN.d[id];if(!x||!n)return;x.checkIn=addDays(x.checkIn,n);x.checkOut=addDays(x.checkOut,n)}
function planNights(id,n){var x=PLAN.d[id],co=addDays(x.checkOut,n);if(co>x.checkIn)x.checkOut=co}
function planCommit(){
  var moved=0,jm=0,jpatch={};
  if(PLAN.moveJ)arr(S.travel).forEach(function(t){
    if(!t.date)return;
    for(var k=0;k<PLAN.ids.length;k++){var id=PLAN.ids[k],b=PLAN.base[id],d=PLAN.d[id];
      if(t.date===b.checkIn&&norm(t.to)===norm(b.location)&&d.checkIn!==b.checkIn){jpatch[t.id]={date:d.checkIn};return}
      if(t.date===b.checkOut&&norm(t.from)===norm(b.location)&&d.checkOut!==b.checkOut){jpatch[t.id]={date:d.checkOut};return}
    }
  });
  PLAN.ids.forEach(function(id){var d=PLAN.d[id];if(d.checkIn!==PLAN.base[id].checkIn||d.checkOut!==PLAN.base[id].checkOut){var pt={checkIn:d.checkIn,checkOut:d.checkOut};applyLocal('stays',id,pt);save('stays',id,pt);moved++}});
  Object.keys(jpatch).forEach(function(id){applyLocal('travel',id,jpatch[id]);save('travel',id,jpatch[id]);jm++});
  PLAN.on=false;PLAN.msgAt=Date.now();PLAN.msg=moved?('Dates set: '+moved+' stay'+(moved>1?'s':'')+' updated'+(jm?' and '+jm+' journey'+(jm>1?'s':'')+' moved':'')+' in the Itinerary.'):'';
  render();
}
/* ---- leave days ---- */
function freeOn(c,d){var f=0;(Array.isArray(c.free)?c.free:[]).forEach(function(x){if(x&&x.date===d)f+=(x.part==='full'?1:0.5)});return Math.min(1,f)}
function leaveCalc(c){

function vPlan(){
  var c=cfg();
  var stays=arr(S.stays).filter(vis).sort(byDate('checkIn')),trv=arr(S.travel).filter(vis).sort(byDate('date')),oth=arr(S.other).filter(vis).sort(byDate('date'));
  var col={},ci=0;stays.forEach(function(s){var k=norm(s.location);if(k&&!(k in col))col[k]=PAL[ci++%PAL.length]});
  var n=stays.length,arrive=[],depart=[],legs=[],acts=[],stray=[],loose=[];
  stays.forEach(function(){arrive.push([]);depart.push([]);legs.push([]);acts.push([])});
  var dist=function(a,b){var x=nightsOf(a,b);return x===''?99999:Math.abs(x)};
  var best=function(loc,date,key){var bi=-1,bd=1e9;if(!norm(loc))return -1;stays.forEach(function(s,i){if(norm(s.location)===norm(loc)){var d=dist(date,s[key]);if(d<bd){bd=d;bi=i}}});return bi};
  var sidx=function(id){for(var q=0;q<stays.length;q++)if(stays[q].id===id)return q;return -1};
  var outsL=[],homesL=[];
  trv.forEach(function(t){
    if(t.leg==='out'){outsL.push(t);return}
    if(t.leg==='home'){homesL.push(t);return}
    if(t.legFrom&&t.legTo){var ia=sidx(t.legFrom),ib=sidx(t.legTo);if(ia>=0&&ib===ia+1){legs[ia].push(t);return}}
    var fi=best(t.from,t.date,'checkOut'),ti=best(t.to,t.date,'checkIn');
    if(fi>=0&&ti===fi+1)legs[fi].push(t);else if(ti>=0)arrive[ti].push(t);else if(fi>=0)depart[fi].push(t);else stray.push(t)});
  oth.forEach(function(o){var i=-1,cand=[];
    if(norm(o.location))stays.forEach(function(s,j){if(norm(s.location)===norm(o.location))cand.push(j)});
    if(cand.length){i=cand[0];cand.forEach(function(j){var s=stays[j];if(o.date&&s.checkIn&&s.checkOut&&o.date>=s.checkIn&&o.date<=s.checkOut)i=j})}
    else if(o.date)stays.forEach(function(s,j){if(i<0&&s.checkIn&&s.checkOut&&o.date>=s.checkIn&&o.date<=s.checkOut)i=j});
    if(i>=0)acts[i].push(o);else loose.push(o)});
  var startX=[],endX=[];

  });

  if(!n)h+='<div class="card empty" style="padding:18px">No places yet. Add your first stay to start the itinerary.</div>';
  if(n)h+=flightsCard('out',outsL,stays[0],c)+(startX.length?'<div class="leg"><div class="lbl">Travel to '+esc(stays[0].location||'first place')+'</div>'+startX.map(function(t){return jrow(t,c)}).join('')+'</div>':'<div class="leg slim"></div>');
  stays.forEach(function(s,i){
    var bg=col[norm(s.location)]||'var(--slate)',nn=nightsOf(s.checkIn,s.checkOut),tot=(+s.cost||0);acts[i].forEach(function(o){tot+=(+o.cost||0)});
    var hOpen=!!EXP['stays/'+s.id];h+='<div class="pbox"><div class="phead tap" data-exp="stays/'+esc(s.id)+'" tabindex="0" role="button" aria-expanded="'+hOpen+'" title="Tap to change the place, dates and stay details" style="background:'+bg+'"><div><h3>'+esc(s.location||'Unnamed place')+'</h3><small>'+(s.checkIn?esc(dfmt(s.checkIn,{day:'numeric',month:'short'}))+' → '+esc(dfmt(s.checkOut,{day:'numeric',month:'short'}))+(nn!==''?' · '+nn+' night'+(nn===1?'':'s'):''):'Dates not set')+'</small></div><span class="ptail">'+(tot?'<span class="ptot">'+money(tot)+'</span>':'')+'<span class="pedit">'+(hOpen?'Close ▾':'Edit ▸')+'</span></span></div>'+(hOpen?editor('stays',s,c):'');
    h+='<div class="sect"><div class="lbl">Stay · arrive from 12pm, leave by 12pm</div>'+irow('stays',s,'🏨',esc(s.name||'Stay (no name yet)'),esc('Arrive '+dayf(s.checkIn)+' · leave '+dayf(s.checkOut)),c,true)+'</div>';
    h+='<div class="sect"><div class="lbl">Things to do</div>'+acts[i].map(function(o){return arow(o,c)}).join('')+addb('other','Add activity',{loc:s.location||'',date:s.checkIn||''})+'</div>';
    h+='</div>';
    if(i<n-1){var nx=stays[i+1];var au=legAuto(s,nx);h+='<div class="leg"><div class="lbl">Travel to '+esc(nx.location||'next place')+'</div>'+(legs[i].length?legs[i].map(function(t){return jrow(t,c)}).join(''):'<div class="item auto"><div class="irow" data-autoleg="'+esc(s.id+'|'+nx.id)+'" tabindex="0" role="button"><span class="ic">🧭</span><div class="it"><b>'+esc((au.from||'?')+' → '+(au.to||'?'))+'</b><small>'+esc(dayf(au.date))+' · filled in from the two cards · tap to add train, flight, cost…</small></div><span class="chipst todo">Add details</span><span class="chev">▸</span></div></div>')+(legs[i].length?addb('travel','Add another journey',{from:s.location||'',to:nx.location||'',date:s.checkOut||'',lf:s.id,lt:nx.id}):'')+'</div>'}
  });
  if(n){var lastS=stays[n-1];for(var q=n-1;q>=0;q--)if(stays[q].checkOut){lastS=stays[q];break}h+=(endX.length?'<div class="leg"><div class="lbl">Travel on from '+esc(lastS.location||'last place')+'</div>'+endX.map(function(t){return jrow(t,c)}).join('')+'</div>':'<div class="leg slim"></div>')+flightsCard('home',homesL,lastS,c)}
  h+='</div><div class="itinfoot">'+addb('stays','Add a place',{})+'</div>';
  if(stray.length)h+='<section class="card"><div class="cardhead"><div><h2>Journeys not linked to a place</h2><p>Their From and To do not match any stay.</p></div></div><div class="sect">'+stray.map(function(t){return jrow(t,c)}).join('')+'</div></section>';
  if(loose.length)h+='<section class="card"><div class="cardhead"><div><h2>Other bookings not linked to a place</h2><p>Set the place or a date that falls in a stay and they will move into its box.</p></div></div><div class="sect">'+loose.map(function(o){return arow(o,c)}).join('')+addb('other','Add booking',{})+'</div></section>';

function isEmpty(){return Object.keys(loadedSet).length>=NEED&&!Object.keys(S.stays).length&&!Object.keys(S.travel).length&&!Object.keys(S.other).length}
function authErr(e){
  var code=(e&&e.code)||'';
  if(code==='auth/unauthorized-domain')return 'This web address is not authorised in Firebase yet. Add it under Authentication, Settings, Authorized domains.';
  if(code==='auth/operation-not-allowed')return 'That sign-in method is not turned on in Firebase yet.';
  if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request')return '';
  if(code==='auth/invalid-action-code'||code==='auth/expired-action-code')return 'That sign-in link has expired or was already used. Ask for a new one.';
  if(code==='permission-denied')return 'You do not have permission to do that.';
  return (e&&e.message)?String(e.message).replace(/^Firebase:\s*/,''):'Something went wrong. Try again.';
}
function authView(){
  if(AUTH==='nocfg')return '<section class="card"><div class="cardhead"><div><h2>Connect Firebase</h2><p>This page is not connected to a Firebase project yet. Open firebase-config.js, paste in your web app settings, and upload it again. The README has the steps.</p></div></div></section>';
  if(AUTH==='loading')return '<div class="loading">Checking sign-in…</div>';
  var msg=AUTHMSG?'<div class="notice">'+esc(AUTHMSG)+'</div>':'';
  if(AUTH==='denied')return '<section class="card"><div class="cardhead"><div><h2>You are signed in, but not on the guest list</h2><p>'+esc(USERMAIL)+' does not have access to this trip. Ask the trip owner to add this email address, then sign in again.</p></div></div><div class="formgrid"><div><button class="btn" data-act="signout" type="button">Sign out</button></div></div></section>';

function exportData(){
  var out={meta:{settings:Object.assign({},cfg())}};
  ['stays','travel','other','days','payments'].forEach(function(c){out[c]={};Object.keys(S[c]).forEach(function(id){out[c][id]=S[c][id]})});
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='europe-2027-backup-'+isoOf(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
}
function readImport(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result),n=0,ok=false;
      ['stays','travel','other','days','payments'].forEach(function(c){if(d[c]&&typeof d[c]==='object'){ok=true;n+=Object.keys(d[c]).length}});
      if(d.meta&&d.meta.settings){ok=true;n++}
      if(!ok)throw new Error('bad');
      IMPORT={n:n,data:d};IMPORTERR='';
    }catch(e){IMPORT=null;IMPORTERR='That file does not look like trip data.'}
    render();
  };
  r.readAsText(f);
}
function doImport(){
  if(!IMPORT)return;var d=IMPORT.data,ops=[];
  ['stays','travel','other','days','payments'].forEach(function(c){if(d[c])Object.keys(d[c]).forEach(function(id){if(d[c][id]&&typeof d[c][id]==='object')ops.push([fs.doc(BASE+'/'+c+'/'+id),d[c][id]])})});
  if(d.meta&&d.meta.settings)ops.push([fs.doc(BASE+'/meta/settings'),d.meta.settings]);
  var chunks=[];for(var i=0;i<ops.length;i+=400)chunks.push(ops.slice(i,i+400));
  inflight++;setSync();
  chunks.reduce(function(p,ch){return p.then(function(){var b=fs.batch();ch.forEach(function(o){b.set(o[0],o[1])});return b.commit()})},Promise.resolve())
    .then(function(){IMPORT=null;IMPORTERR=''},function(e){IMPORTERR='Import failed: '+authErr(e)})
    .then(function(){inflight--;setSync();render()});
}
function finishLink(em){
  AUTHMSG='';
  auth.signInWithEmailLink(em,location.href).then(function(){
    try{localStorage.removeItem('tripEmail')}catch(e){}
    history.replaceState(null,'',location.pathname+location.hash);
  }).catch(function(e){PENDING_LINK=false;AUTHMSG=authErr(e);render()});
}
function doAct(a){
  var el=document.getElementById('authEmail'),em=(el?el.value:AUTHEMAIL||'').trim();
  if(a==='google'){
    AUTHMSG='';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){AUTHMSG=authErr(e);render()});
  }else if(a==='sendlink'){
    if(em.indexOf('@')<1){AUTHMSG='Enter your email address first.';render();return}
    AUTHEMAIL=em;try{localStorage.setItem('tripEmail',em)}catch(e){}
    auth.sendSignInLinkToEmail(em,{url:location.origin+location.pathname,handleCodeInApp:true})
      .then(function(){AUTHMSG='We sent a sign-in link to '+em+'. Open it in this browser. Check your junk folder if it does not arrive.';render()})
      .catch(function(e){AUTHMSG=authErr(e);render()});
  }else if(a==='finishlink'){
    if(em.indexOf('@')<1){AUTHMSG='Enter the email address the link was sent to.';render();return}
    finishLink(em);
  }else if(a==='signout'){auth.signOut()}
  else if(a==='export'){exportData()}
  else if(a==='doimport'){doImport()}
  else if(a==='cancelimport'){IMPORT=null;render()}
}

  scheduleSync();
  setSync();
  if(fid){var el=document.getElementById(fid);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}
function trigger(){if(pendingEdits>0){needRender=true;return}render()}

/* ---------- events ---------- */
function onField(el){
  if(RO)return;var d=el.dataset;if(!d.c)return;var v=el.value,t=d.t,f=d.f;
  if(t==='num'){
    v=String(v).trim()===''?null:parseFloat(String(v).replace(/[$,\s]/g,''));
    if(v!==null&&isNaN(v))return;
  }
  var patch={};patch[f]=v;
  applyLocal(d.c,d.i,patch);save(d.c,d.i,patch);
  if(d.c==='meta'&&(f==='p1'||f==='p2'||f==='start'||f==='end'))renderHead();
}
document.addEventListener('input',function(e){if(e.target.closest&&e.target.closest('#view')&&e.target.tagName!=='SELECT')onField(e.target)});
document.addEventListener('change',function(e){if(e.target.closest&&e.target.closest('#view')){onField(e.target);if(e.target.tagName==='SELECT'||e.target.type==='date'||(e.target.dataset&&e.target.dataset.c==='meta'&&e.target.dataset.f!=='settleP1'&&e.target.dataset.f!=='settleP2'))render()}});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.dataset.act){doAct(b.dataset.act);return}
  if(RO)return;
  if(b.dataset.add){var c=b.dataset.add,id,pay={status:'Researching',for:(VIEW==='all'?'shared':VIEW),cost:null,paidBy:'',share:null,notes:''};
    if(c==='stays')id=add(c,Object.assign({location:'',checkIn:'',checkOut:'',name:''},pay));
    else if(c==='travel')id=add(c,Object.assign({date:'',from:'',to:'',type:'Train',provider:''},pay));
    else if(c==='other')id=add(c,Object.assign({date:'',item:'',location:'',category:'Experience / tour',provider:''},pay));
    var f=document.getElementById(c+'-'+id+'-'+(c==='stays'?'location':c==='travel'?'date':'item'));if(f)f.focus();
  }else if(b.dataset.del){
    if(b.classList.contains('armed')){var p=b.dataset.del.split('/');remove(p[0],p.slice(1).join('/'))}
    else{b.classList.add('armed');b.textContent='Delete?';setTimeout(function(){if(b.isConnected){b.classList.remove('armed');b.textContent='✕'}},3000)}
  }
});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='viewas'){VIEW=e.target.value;try{localStorage.setItem('tripView',VIEW)}catch(x){}render()}});
document.addEventListener('focusout',function(e){var t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='date'&&t.closest&&t.closest('#view'))setTimeout(render,0)},true);
document.addEventListener('change',function(e){if(e.target&&e.target.id==='importFile')readImport(e.target)});
document.addEventListener('input',function(e){if(e.target&&e.target.id==='authEmail')AUTHEMAIL=e.target.value});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='authEmail'){e.preventDefault();doAct(PENDING_LINK?'finishlink':'sendlink')}});
window.addEventListener('hashchange',function(){window.scrollTo(0,0);render()});

/* ---------- start ---------- */
function markLoaded(k){loadedSet[k]=1;setSync()}
function teardown(){
  unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[];
  loadedSet={};confirmed={};timedOut=false;S={stays:{},travel:{},other:{},days:{},payments:{},settings:null};
}
function subErr(err){
  console.error(err);
  if(err&&err.code==='permission-denied'){teardown();AUTH='denied';render();return}
  timedOut=true;render();
}
function subColl(c){
  unsubs.push(db.collection(c).onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var k=c+'/'+d.id;confirmed[k]=1;var data=Object.assign({},d.data());var e=q[k];m[d.id]=(e&&e.timer)?Object.assign(data,e.patch):data});
    S[c]=m;markLoaded(c);trigger();
  },subErr));
}
function start(){
  render();
  var fc=window.FIREBASE_CONFIG;
  if(!window.firebase||!fc||!fc.apiKey||/PASTE|YOUR_/i.test(fc.apiKey)){AUTH='nocfg';noDb=true;render();return}
  try{firebase.initializeApp(fc);auth=firebase.auth();fs=firebase.firestore()}
  catch(e){console.error(e);AUTH='nocfg';noDb=true;render();return}
  db={collection:function(c){return fs.collection(BASE+'/'+c)},doc:function(p){return fs.doc(BASE+'/'+p)}};
  setTimeout(function(){if(AUTH==='in'&&Object.keys(loadedSet).length<NEED){timedOut=true;render()}},10000);
  if(auth.isSignInWithEmailLink(location.href)){
    var em=null;try{em=localStorage.getItem('tripEmail')}catch(e){}
    if(em)finishLink(em);else PENDING_LINK=true;
  }
  auth.onAuthStateChanged(function(u){
    if(u){
      USERMAIL=u.email||'';AUTH='in';PENDING_LINK=false;AUTHMSG='';
      var w=$('#who');if(w)w.textContent=USERMAIL;
      if(!unsubs.length){
        COLLS.forEach(subColl);
        unsubs.push(db.doc('meta/settings').onSnapshot(function(s){
          if(s.exists){S.settings=Object.assign({},s.data());confirmed['meta/settings']=1}else S.settings=null;
          markLoaded('meta');trigger();
        },subErr));
      }
      render();
    }else{teardown();AUTH='out';render()}
  });
}
start();
})();
</script>
</body></html>
